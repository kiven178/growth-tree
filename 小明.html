    function drawPie() {
      const canvas = document.getElementById('pieChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = 80, h = 80;
      canvas.width = w; canvas.height = h;
      ctx.clearRect(0, 0, w, h);
      const center = 40, radius = 32;
      const totalLearnedAll = categories.reduce((s,c)=> s + c.learned_count, 0);
      const totalKnowledge = 24;
      const percent = totalKnowledge === 0 ? 0 : totalLearnedAll / totalKnowledge;
      const start = -Math.PI/2;
      const end = start + percent * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, 2*Math.PI);
      ctx.fillStyle = "#E0E0E0";
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, start, end);
      ctx.fillStyle = "#4CAF50";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(center, center, 22, 0, 2*Math.PI);
      ctx.fillStyle = "#FFF9C4";
      ctx.fill();
      ctx.fillStyle = "#2e7d32";
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(Math.round(percent*100)+"%", center, center);
    }

    function playClickSound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

      }
      const monsterHtml = detail.mistake ? `<div><strong>🐉 错题小怪兽</strong><p>${detail.mistake}</p>${detail.mistake_monster_img ? `<img src="${detail.mistake_monster_img}" width="80">` : ''}</div>` : '';
      const highlightMedia = detail.gif_url ? `<img src="${detail.gif_url}" style="width:100%; border-radius:12px;">` : (detail.highlight_img ? `<img src="${detail.highlight_img}" style="width:100%; border-radius:12px;">` : '');
      const html = `
        <h2>🍎 ${detail.title}</h2>
        <div><strong>📘 知识点</strong><p>${detail.knowledge || ''}</p></div>
        <div><strong>🌟 高光时刻</strong><p>${detail.highlight || ''}</p>${highlightMedia}</div>
        ${monsterHtml}
        <div><strong>📜 剧情进展</strong><p>${detail.story || ''}</p></div>
      `;
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('fruitModal').style.display = 'flex';
      if (detail.voice_url && detail.voice_url !== 'None') {
        new Audio(detail.voice_url).play().catch(e=>console.log);
      }
    }

    function showNextHint() {
      document.getElementById('modalContent').innerHTML = `<div style="text-align:center;"><h2>${eggIcon} 神秘蛋</h2><p>学完下堂课，你就能看到新伙伴啦！</p><p>加油继续学习吧~</p></div>`;
      document.getElementById('fruitModal').style.display = 'flex';
    }

    function showEncyclopedia(cat) {
      const unlockedDinos = cat.learned_details.map(node => `
        <div style="display:inline-block; margin:8px; text-align:center; cursor:pointer;" onclick="showDinoModalById(${node.id}, '${cat.name}')">
          <img src="images/trees/animal/main/${node.id}-${node.dino_name}.png" style="width:100px; border-radius:16px;" onerror="this.src='images/trees/animal/main/default.png'">
          <div>${node.dino_name}</div>
        </div>
      `).join('');
      document.getElementById('modalContent').innerHTML = `<h2>📖 ${cat.habitat}图鉴</h2><div style="display:flex; flex-wrap:wrap; justify-content:center;">${unlockedDinos || '<p>还没有解锁任何伙伴，快去学习吧！</p>'}</div>`;
      document.getElementById('fruitModal').style.display = 'flex';
    }

    window.showDinoModalById = function(nodeId, catName) {
      const cat = categories.find(c => c.name === catName);
      const node = cat.learned_details.find(n => n.id === nodeId);
      if (node) showDinoModal(node, false);
    };

    // 砸蛋逻辑
    function crackCurrentDino(card, cat, slotElement, slotIndex, node) {
      // 播放音效
      playClickSound();
      // 将当前跳动恐龙变为普通恐龙
      slotElement.classList.remove('current-dino');
      slotElement.classList.add('unlocked');
      // 记录已点击
      let clickedIds = JSON.parse(localStorage.getItem(storageKey) || '[]');
      if (!clickedIds.includes(node.id)) {
        clickedIds.push(node.id);
        localStorage.setItem(storageKey, JSON.stringify(clickedIds));
      }
      // 处理下一个灰蛋
      const slots = card.querySelectorAll('.slot-item');
      const nextSlot = slots[slotIndex + 1];
      if (nextSlot && nextSlot.classList.contains('locked')) {
        nextSlot.classList.remove('locked');
        nextSlot.classList.add('next-gray');
        nextSlot.innerHTML = eggIcon;
      }
      // 弹出介绍（新恐龙）
      showDinoModal(node, true);
    }

    function initForest() {
      categories = JSON.parse(JSON.stringify(categoriesRaw));
      drawPie();
      const treeList = document.getElementById('treeList');
      treeList.innerHTML = '';

      let clickedIds = JSON.parse(localStorage.getItem(storageKey) || '[]');

      for (let cat of categories) {
        const total = cat.total;
        const learnedCount = cat.learned_count;
        const learnedDetails = cat.learned_details;

        // 构建槽位
        let slotsHtml = '';
        for (let i = 1; i <= total; i++) {
          const isUnlocked = i <= learnedCount;
          const node = (isUnlocked && i-1 < learnedDetails.length) ? learnedDetails[i-1] : null;
          const isCurrentDino = (isUnlocked && node && node.id === globalLatestId && !clickedIds.includes(node.id));
          const isNextGray = (!isUnlocked && i === learnedCount + 1);
          let icon = '';
          let extraClass = '';
          if (isUnlocked) {
            icon = dinoIcon;
            extraClass = isCurrentDino ? 'unlocked current-dino' : 'unlocked';
          } else if (isNextGray) {
            icon = eggIcon;
            extraClass = 'next-gray';
          } else {
            icon = eggIcon;
            extraClass = 'locked';
          }
          slotsHtml += `<div class="slot-item ${extraClass}" data-slot="${i}" data-cat="${cat.name}" data-node-id="${node ? node.id : ''}">${icon}</div>`;
        }

        // 生成知识点列表（明确绑定 showLearningRecord）
        const knowledgeHtml = learnedDetails.map(node => `
          <div class="knowledge-item" data-node-id="${node.id}">📘 ${node.detail.title}</div>
        `).join('');

        const card = document.createElement('div');
        card.className = 'tree-card';
        card.innerHTML = `
          <div class="tree-img-container">
            <img class="tree-bg" src="${cat.fog_image}" alt="${cat.name}">
          </div>
          <div class="tree-info">
            <div>
              <span class="tree-name">${cat.style.name}</span>
              <span class="category-title">🏅 ${cat.title}</span>
            </div>
            <div class="slot-bar" data-cat="${cat.name}">
              ${slotsHtml}
              <button class="encyclopedia-btn" data-cat="${cat.name}">📖 图鉴</button>
            </div>
            <div class="knowledge-list" data-cat="${cat.name}">
              ${knowledgeHtml}
            </div>
          </div>
        `;
        treeList.appendChild(card);

        // 绑定事件
        card.querySelector('.encyclopedia-btn').addEventListener('click', () => showEncyclopedia(cat));

        // 知识点列表项：点击显示学习记录
        card.querySelectorAll('.knowledge-item').forEach(el => {
          const nodeId = parseInt(el.dataset.nodeId);
          const node = learnedDetails.find(n => n.id === nodeId);
          if (node) {
            // 明确绑定 showLearningRecord
            el.addEventListener('click', (e) => {
              e.stopPropagation();
              showLearningRecord(node);
            });
          }
        });

        // 槽位点击
        const slots = card.querySelectorAll('.slot-item');
        slots.forEach((slot, idx) => {
          if (slot.classList.contains('current-dino')) {
            const node = learnedDetails[idx];
            if (node) {
              slot.addEventListener('click', () => crackCurrentDino(card, cat, slot, idx, node));
            }
          } else if (slot.classList.contains('next-gray')) {
            slot.addEventListener('click', () => showNextHint());
          } else if (slot.classList.contains('unlocked')) {
            const node = learnedDetails[idx];
            if (node) {
              slot.addEventListener('click', (e) => {
                e.stopPropagation();
                showDinoModal(node, false);
              });
            }
          }
        });
      }
    }

    function closeModal() { document.getElementById('fruitModal').style.display = 'none'; }
    function toggleLetter() { const el = document.getElementById('letterContent'); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
    function changeBg() {
      const url = prompt('背景图片链接（留空清除）');
      if (url !== null) {
        if (url.trim() === '') localStorage.removeItem('forest_bg');
        else localStorage.setItem('forest_bg', url.trim());
        document.body.style.setProperty('--custom-bg', url.trim() ? `url(${url.trim()})` : 'none');
      }
    }
    function toggleMusic() {
      if (!bgMusic.src || bgMusic.src === '') return;
      if (musicPlaying) { bgMusic.pause(); musicPlaying = false; }
      else { bgMusic.play().then(()=>musicPlaying=true).catch(e=>console.log); }
    }
    function generateShareCard() {
      const element = document.querySelector('.forest');
      html2canvas(element, { scale: 2, backgroundColor: null }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'forest_share.png';
        link.href = canvas.toDataURL();
        link.click();
      }).catch(err => alert('截图失败，请重试'));
    }

    window.addEventListener('load', () => {
      if ("nan" && "nan" !== "") {
        bgMusic.load();
        bgMusic.play().then(()=>musicPlaying=true).catch(e=>console.log);
      }
    });
  </script>
</body>
</html>
