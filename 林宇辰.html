    .slot-item.locked { background: #ccc; color: #888; cursor: default; }
    .slot-item.next-gray { background: #aaa; color: #eee; animation: pulseGray 1.5s infinite; cursor: pointer; }
    @keyframes pulseGray { 0% { transform: scale(1); background: #aaa; } 50% { transform: scale(1.05); background: #888; } 100% { transform: scale(1); background: #aaa; } }
    .slot-item:hover { transform: scale(1.1); }
    .encyclopedia-btn { background: #9c27b0; color: white; border: none; border-radius: 30px; padding: 4px 12px; font-size: 12px; cursor: pointer; margin-left: auto; flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; }
    .gallery { margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 12px; }
    .gallery-images { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .gallery-images img { width: 60px; height: 60px; border-radius: 12px; border: 2px solid #ffb347; }
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 2000; overflow: auto; }

    const categoriesRaw = [{"fog_image": "https://tkq7384tp.hn-bkt.clouddn.com/images/trees/dinosaur/fog/\u5929\u7a7a/1.png", "fog_image_base": "https://tkq7384tp.hn-bkt.clouddn.com/images/trees/dinosaur/fog/\u5929\u7a7a", "habitat": "\u5929\u7a7a", "latest_node": {"detail": {"knowledge": "split(\u5206\u9694\u7b26)`\u628a\u5b57\u7b26\u4e32\u5207\u5f00\uff0c\u5f97\u5230\u5217\u8868\uff0c\u4e0d\u4f20\u53c2\u5c31\u6309\u7a7a\u767d\u5207\ns = \"hello python\"\nprint(s.split())\n# \u8f93\u51fa\uff1a[\u0027hello\u0027, \u0027python\u0027]\ns = \"a,b,c,d\"\nprint(s.split(\u0027,\u0027))\n# \u8f93\u51fa\uff1a[\u0027a\u0027, \u0027b\u0027, \u0027c\u0027, \u0027d\u0027]", "mistake": "\u7b2c5\u9898\u6709\u9519\uff0c\u8bf7\u67e5\u770b\u89c6\u9891\u89e3\u6790\u3002", "title": "split\u547d\u4ee4", "wrong_videos": ["https://tkq7384tp.hn-bkt.clouddn.com/videos/1/5.mp4"]}, "dino_intro": "\u9a70\u9f99\u867d\u7136\u4f53\u578b\u4e0d\u5927\uff0c\u4f46\u5b83\u662f\u767d\u57a9\u7eaa\u6700\u806a\u660e\u7684\u730e\u624b\u4e4b\u4e00\u3002\u5b83\u540e\u722a\u4e0a\u957f\u7740\u9570\u5200\u72b6\u7684\u5229\u722a\uff0c\u80fd\u50cf\u5f39\u7c27\u5200\u4e00\u6837\u5f39\u51fa\uff0c\u7ed9\u730e\u7269\u81f4\u547d\u4e00\u51fb\u3002\u9a70\u9f99\u5f88\u53ef\u80fd\u662f\u7fa4\u5c45\u52a8\u7269\uff0c\u5b83\u4eec\u4f1a\u5408\u4f5c\u6355\u730e\uff0c\u5c31\u50cf\u72fc\u7fa4\u4e00\u6837\u3002", "dino_name": "\u9a70\u9f99", "id": 1, "status": "completed"}, "learned_count": 1, "learned_details": [{"detail": {"knowledge": "split(\u5206\u9694\u7b26)`\u628a\u5b57\u7b26\u4e32\u5207\u5f00\uff0c\u5f97\u5230\u5217\u8868\uff0c\u4e0d\u4f20\u53c2\u5c31\u6309\u7a7a\u767d\u5207\ns = \"hello python\"\nprint(s.split())\n# \u8f93\u51fa\uff1a[\u0027hello\u0027, \u0027python\u0027]\ns = \"a,b,c,d\"\nprint(s.split(\u0027,\u0027))\n# \u8f93\u51fa\uff1a[\u0027a\u0027, \u0027b\u0027, \u0027c\u0027, \u0027d\u0027]", "mistake": "\u7b2c5\u9898\u6709\u9519\uff0c\u8bf7\u67e5\u770b\u89c6\u9891\u89e3\u6790\u3002", "title": "split\u547d\u4ee4", "wrong_videos": ["https://tkq7384tp.hn-bkt.clouddn.com/videos/1/5.mp4"]}, "dino_intro": "\u9a70\u9f99\u867d\u7136\u4f53\u578b\u4e0d\u5927\uff0c\u4f46\u5b83\u662f\u767d\u57a9\u7eaa\u6700\u806a\u660e\u7684\u730e\u624b\u4e4b\u4e00\u3002\u5b83\u540e\u722a\u4e0a\u957f\u7740\u9570\u5200\u72b6\u7684\u5229\u722a\uff0c\u80fd\u50cf\u5f39\u7c27\u5200\u4e00\u6837\u5f39\u51fa\uff0c\u7ed9\u730e\u7269\u81f4\u547d\u4e00\u51fb\u3002\u9a70\u9f99\u5f88\u53ef\u80fd\u662f\u7fa4\u5c45\u52a8\u7269\uff0c\u5b83\u4eec\u4f1a\u5408\u4f5c\u6355\u730e\uff0c\u5c31\u50cf\u72fc\u7fa4\u4e00\u6837\u3002", "dino_name": "\u9a70\u9f99", "id": 1, "status": "completed"}], "name": "\u5929\u7a7a", "next_id": 6, "style": {"name": "\u5929\u7a7a"}, "title": "\u2601\ufe0f \u5929\u7a7a\u65b0\u79c0", "total": 2}, {"fog_image": "https://tkq7384tp.hn-bkt.clouddn.com/images/trees/dinosaur/fog/\u68ee\u6797/0.png", "fog_image_base": "https://tkq7384tp.hn-bkt.clouddn.com/images/trees/dinosaur/fog/\u68ee\u6797", "habitat": "\u68ee\u6797", "latest_node": null, "learned_count": 0, "learned_details": [], "name": "\u68ee\u6797", "next_id": 2, "style": {"name": "\u68ee\u6797"}, "title": "\ud83e\udd5a \u86cb\u58f3\u65b0\u661f", "total": 5}];
    let categories = [];
    let musicPlaying = false;
    const bgMusic = document.getElementById('bgMusic');

    function drawPie() {
      const canvas = document.getElementById('pieChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = 80, h = 80;
      canvas.width = w; canvas.height = h;
      ctx.clearRect(0, 0, w, h);
      const center = 40, radius = 32;
      const totalLearnedAll = categories.reduce((s,c)=> s + c.learned_count, 0);
      const totalKnowledge = 24;
      const percent = totalKnowledge === 0 ? 0 : totalLearnedAll / totalKnowledge;
      const start = -Math.PI/2;
      const end = start + percent * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, 2*Math.PI);
      ctx.fillStyle = "#E0E0E0";
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, start, end);
      ctx.fillStyle = "#4CAF50";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(center, center, 22, 0, 2*Math.PI);
      ctx.fillStyle = "#FFF9C4";
      ctx.fill();
      ctx.fillStyle = "#2e7d32";
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(Math.round(percent*100)+"%", center, center);
    }

    // ========== 显示课后作业 ==========

        </div>
      `;

      document.getElementById('fruitModal').style.display = 'flex';

    // ========== 显示学习记录（含错题视频） ==========
    function showLearningRecord(node) {
      const detail = node.detail;
      if (!detail) {
        document.getElementById('modalContent').innerHTML = '<p>暂无学习记录</p>';
        document.getElementById('fruitModal').style.display = 'flex';
        return;

      let wrongVideosHtml = '';
      if (detail.wrong_videos && detail.wrong_videos.length > 0) {
        const mistakeText = detail.mistake || '有错题，请查看下方解析视频。';
        wrongVideosHtml = `<div><strong>📹 错题解析</strong><p>${mistakeText}</p><div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:8px;">`;

        });
        wrongVideosHtml += `</div></div>`;
      } else {
        wrongVideosHtml = `<div style="text-align:center; margin-top:12px; padding:10px; background:#e8f5e9; border-radius:12px;">

          <p style="font-weight:bold; color:#2e7d32;">太棒啦！没有错题，继续保持！</p>

      }

      const knowledgeHtml = detail.knowledge ? `<p style="white-space: pre-wrap;">${detail.knowledge}</p>` : '';

      const html = `
        <div style="text-align:left;">
          <h2 style="color:#2e7d32;">📚 学习记录</h2>

      const cat = categories.find(c => c.name === catName);

    // ========== 初始化森林 ==========
    function initForest() {
      categories = JSON.parse(JSON.stringify(categoriesRaw));
      drawPie();
      const treeList = document.getElementById('treeList');
      treeList.innerHTML = '';

      const nextLessonId = globalLatestId + 1;

      for (let cat of categories) {
        const total = cat.total;
        const learnedCount = cat.learned_count;
        const learnedDetails = cat.learned_details;
        const nextId = cat.next_id;

        let slotsHtml = '';
        for (let i = 1; i <= total; i++) {
          const isUnlocked = i <= learnedCount;
          const node = isUnlocked ? learnedDetails[i-1] : null;
          let icon = '';
          let extraClass = '';
          if (isUnlocked) {
            icon = dinoIcon;
            extraClass = 'unlocked';
          } else {
            const isNextGlobal = (nextId === nextLessonId && i === learnedCount + 1);
            if (isNextGlobal) {
              icon = eggIcon;
              extraClass = 'next-gray';
            } else {
              icon = eggIcon;
              extraClass = 'locked';
            }
          }
          slotsHtml += `<div class="slot-item ${extraClass}" data-slot="${i}" data-cat="${cat.name}" data-node-id="${node ? node.id : ''}">${icon}</div>`;
        }

        const card = document.createElement('div');
        card.className = 'tree-card';
        card.innerHTML = `
          <div class="tree-img-container">
            <img class="tree-bg" src="${cat.fog_image}" alt="${cat.name}">
          </div>
          <div class="tree-info">
            <div>
              <span class="tree-name">${cat.style.name}</span>
              <span class="category-title">🏅 ${cat.title}</span>
            </div>
            <div class="slot-bar" data-cat="${cat.name}">
              ${slotsHtml}
              <button class="encyclopedia-btn" data-cat="${cat.name}">📖 图鉴</button>
            </div>
          </div>
        `;
        treeList.appendChild(card);

        const slots = card.querySelectorAll('.slot-item');
        slots.forEach((slot, idx) => {
          const nodeId = slot.dataset.nodeId;
          const node = learnedDetails.find(n => n.id == nodeId);
          if (slot.classList.contains('unlocked') && node) {
            slot.addEventListener('click', () => showDinoModal(node));
          } else if (slot.classList.contains('next-gray')) {
            slot.addEventListener('click', () => showNextHint());
          }
        });

        card.querySelector('.encyclopedia-btn').addEventListener('click', () => showEncyclopedia(cat));

        const knowledgeList = document.createElement('div');
        knowledgeList.className = 'knowledge-list';
        learnedDetails.forEach(node => {
          const item = document.createElement('div');
          item.className = 'knowledge-item';
          item.textContent = `📘 ${node.detail.title}`;
          item.addEventListener('click', () => showLearningRecord(node));
          knowledgeList.appendChild(item);
        });
        card.querySelector('.tree-info').appendChild(knowledgeList);
      }
    }

    function closeModal() { document.getElementById('fruitModal').style.display = 'none'; }

    window.addEventListener('load', () => {
      if ("nan" && "nan" !== "") {
        bgMusic.load();
        bgMusic.play().then(() => musicPlaying = true).catch(() => {});
      }
    });
  </script>
</body>
</html>
